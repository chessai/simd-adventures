[workspace]
resolver = "3"
members = ["simdlab", "template", "pngsimd", "vecfilter", "vcodec"]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
libc = "0.2"
simdlab = { path = "simdlab" }

# Workspace-wide (member [profile] sections are ignored). Taken from pngsimd, whose benchmark
# results were measured with these settings.
[profile.release]
debug = 1
codegen-units = 1
lto = "fat"

[profile.bench]
inherits = "release"
